name: Update OpenAlex metrics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch OpenAlex metrics
        run: python scripts/fetch-openalex-metrics.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/metrics.yaml; then
            echo "No metrics changes."
            exit 0
          fi
          git add data/metrics.yaml
          git commit -m "Update OpenAlex citation metrics."
          git push

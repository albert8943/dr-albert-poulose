  <figcaption id="fig-classification-caption" class="research-figure-caption">
    Power system stability classification, <strong>redrawn</strong> for this site after the IEEE/CIGRE task-force definitions (not a reproduction of publisher artwork). Dynamic security in my work maps mainly to <strong>rotor-angle stability</strong> and its <strong>transient</strong> branch, extended in converter-dominated grids by <strong>converter-driven stability</strong>.
    Source:
    <a href="https://doi.org/10.1109/TPWRS.2020.3041774" target="_blank" rel="noopener noreferrer">Hatziargyriou et al., IEEE Trans. Power Syst., 2021</a>
    (revision of the 2004 framework:
    <a href="https://doi.org/10.1109/TPWRS.2004.825981" target="_blank" rel="noopener noreferrer">Kundur et al., IEEE Trans. Power Syst., 2004</a>).
  </figcaption>

  <figcaption id="fig-02-caption" class="research-figure-caption">
    Scientific AI here is a surrogate for post-fault trajectories, not a classifier that only says stable or unstable. Time-domain simulation remains the teacher. The physics-informed neural network (PINN) is queried many times for planning-oriented TSA and CCT studies when repeating full simulation would be too slow.
  </figcaption>

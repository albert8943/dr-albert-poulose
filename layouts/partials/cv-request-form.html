<form class="cv-form" id="cv-request-form" action="{{ if site.Params.formspreeId }}https://formspree.io/f/{{ site.Params.formspreeId }}{{ else }}#{{ end }}" method="POST">
  <div class="form-group">
    <label for="cv-name">Name <span class="required">*</span></label>
    <input type="text" id="cv-name" name="name" required autocomplete="name">
  </div>
  <div class="form-group">
    <label for="cv-email">Email <span class="required">*</span></label>
    <input type="email" id="cv-email" name="email" required autocomplete="email">
  </div>
  <div class="form-group">
    <label for="cv-org">Organization</label>
    <input type="text" id="cv-org" name="organization" autocomplete="organization">
  </div>
  <div class="form-group">
    <label for="cv-purpose">Purpose</label>
    <select id="cv-purpose" name="purpose">
      <option value="Faculty application">Faculty application</option>
      <option value="Collaboration">Collaboration</option>
      <option value="General inquiry" selected>General inquiry</option>
    </select>
  </div>
  <input type="hidden" name="_subject" value="CV Request from website">
  <button type="submit" class="btn">Submit Request</button>
</form>

<p class="cv-fallback">
  Prefer email?
  <a href="mailto:{{ site.Params.email }}?subject=CV%20Request&amp;body=Name:%0AOrganization:%0APurpose:%20General%20inquiry">Request CV via Email</a>
</p>

{{ if not site.Params.formspreeId }}
<p class="cv-setup-note"><em>Site owner: add your Formspree form ID to <code>hugo.toml</code> under <code>params.formspreeId</code>, or use the email link above.</em></p>
{{ end }}

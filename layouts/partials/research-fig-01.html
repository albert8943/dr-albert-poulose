  <figcaption id="fig-01-caption" class="research-figure-caption">
    Conventional machines are assessed with synchronizing torque among generators. Converter-connected plants are not the same device: grid-following (GFL) and grid-forming (GFM) need different models. Direct energy functions give a CCT for the GFM unit when a GFL converter is in parallel, without waiting for a long time-domain sweep.

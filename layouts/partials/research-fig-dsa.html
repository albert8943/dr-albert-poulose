<figure class="research-figure" aria-labelledby="fig-dsa-caption">
  <svg class="research-figure-svg" viewBox="0 0 640 300" role="img" aria-label="Rotor-angle trajectories after a fault. Clearing before critical clearing time returns to synchronism; clearing after critical clearing time loses synchronism.">
    <defs>
      <style>
        .fg-axis { stroke: #1a2332; stroke-width: 1.4; fill: none; }
        .fg-grid { stroke: #e2e8f0; stroke-width: 1; fill: none; }
        .fg-label { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6578; }
        .fg-title { font-family: Georgia, "Times New Roman", serif; font-size: 14px; font-weight: 700; fill: #1a2332; }
        .fg-stable { fill: none; stroke: #0d6e7a; stroke-width: 2.4; }
        .fg-unstable { fill: none; stroke: #b35c1e; stroke-width: 2.4; stroke-dasharray: 6 4; }
        .fg-cct { stroke: #2a6f97; stroke-width: 1.4; stroke-dasharray: 3 3; }
      </style>
    </defs>
    <text class="fg-title" x="320" y="22" text-anchor="middle">After a fault: the margin is critical clearing time</text>

    <line class="fg-grid" x1="70" y1="60" x2="600" y2="60"/>
    <line class="fg-grid" x1="70" y1="110" x2="600" y2="110"/>
    <line class="fg-grid" x1="70" y1="160" x2="600" y2="160"/>

    <line class="fg-axis" x1="70" y1="210" x2="600" y2="210"/>
    <line class="fg-axis" x1="70" y1="36" x2="70" y2="210"/>
    <text class="fg-label" x="22" y="124" transform="rotate(-90 22 124)">Rotor angle</text>
    <text class="fg-label" x="335" y="232" text-anchor="middle">Time</text>

    <line class="fg-cct" x1="150" y1="40" x2="150" y2="210"/>
    <text class="fg-label" x="150" y="248" text-anchor="middle">Fault</text>
    <line class="fg-cct" x1="310" y1="40" x2="310" y2="210"/>
    <text class="fg-label" x="310" y="248" text-anchor="middle">CCT</text>

    <path class="fg-stable" d="M70 168 C 110 168, 130 168, 150 168 C 190 108, 240 94, 280 88 C 320 82, 360 96, 400 118 C 450 142, 500 154, 590 160"/>
    <path class="fg-unstable" d="M70 168 C 110 168, 130 168, 150 168 C 200 92, 250 68, 310 50 C 370 36, 450 30, 590 26"/>

    <text class="fg-label" x="500" y="148" fill="#0d6e7a" font-weight="700">t_cl &lt; CCT</text>
    <text class="fg-label" x="500" y="40" fill="#b35c1e" font-weight="700">t_cl &gt; CCT</text>

    <line class="fg-stable" x1="70" y1="272" x2="102" y2="272"/>
    <text class="fg-label" x="110" y="276">Cleared in time: stays in synchronism</text>
    <line class="fg-unstable" x1="340" y1="272" x2="372" y2="272"/>
    <text class="fg-label" x="380" y="276">Cleared too late: loses synchronism</text>
  </svg>
  <figcaption id="fig-dsa-caption" class="research-figure-caption">
    Dynamic security asks whether the present operating point still has enough margin after a credible short circuit. Critical clearing time (CCT) is one such margin: clear the fault soon enough and the machines stay in step; clear it too late and they do not.
  </figcaption>
</figure>
